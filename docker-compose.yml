services:

  postgres:
    image: postgres:16
    container_name: postgres-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: users_db
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/01-init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql
      - ./docker/postgres/02-seed-users.sql:/docker-entrypoint-initdb.d/02-seed-users.sql
      - ./docker/postgres/03-seed-teachers.sql:/docker-entrypoint-initdb.d/03-seed-teachers.sql
      - ./docker/postgres/04-seed-bookings.sql:/docker-entrypoint-initdb.d/04-seed-bookings.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d users_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server kafka:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  mongodb:
    image: mongo:7.0
    container_name: mongodb
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: secret
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  user-service:
    image: jose200112/polyparrot-user-service
    container_name: user-service
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DB_HOST: postgres-db
      DB_PORT: 5432
      DB_USER: admin
      DB_PASS: secret
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  teacher-service:
    image: jose200112/polyparrot-teacher-service
    container_name: teacher-service
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      DB_HOST: postgres-db
      DB_PORT: 5432
      DB_USER: admin
      DB_PASS: secret
      KAFKA_HOST: kafka
      BOOKING_SERVICE_HOST: booking-service
      USER_SERVICE_HOST: user-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  booking-service:
    image: jose200112/polyparrot-booking-service
    container_name: booking-service
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      DB_HOST: postgres-db
      DB_PORT: 5432
      DB_USER: admin
      DB_PASS: secret
      KAFKA_HOST: kafka
      TEACHER_SERVICE_HOST: teacher-service
      USER_SERVICE_HOST: user-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  notification-service:
    image: jose200112/polyparrot-notification-service
    container_name: notification-service
    ports:
      - "127.0.0.1:8083:8083"
    environment:
      MONGO_HOST: mongodb
      MONGO_USER: admin
      MONGO_PASS: secret
      KAFKA_HOST: kafka
    depends_on:
      - mongodb
      - kafka
    restart: unless-stopped

  chat-service:
    image: jose200112/polyparrot-chat-service
    container_name: chat-service
    ports:
      - "127.0.0.1:8084:8084"
    environment:
      MONGO_HOST: mongodb
      MONGO_USER: admin
      MONGO_PASS: secret
    depends_on:
      - mongodb
    restart: unless-stopped

  frontend:
    image: jose200112/polyparrot-frontend
    container_name: frontend
    depends_on:
      - user-service
      - teacher-service
      - booking-service
      - notification-service
      - chat-service
    restart: unless-stopped

  gateway:
    image: nginx:1.27-alpine
    container_name: gateway
    # Only published port open to the network (the ALB reaches it on AWS).
    ports:
      - "${GATEWAY_PORT:-80}:80"
    volumes:
      - ./docker/gateway/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - user-service
      - teacher-service
      - booking-service
      - notification-service
      - chat-service
    restart: unless-stopped

volumes:
  postgres_data:
  mongo_data:
